custom.system:
  config-name: local
  public-image-server-url: "/p/file/download/:FILEID:"
  base-server-url: "http://localhost:8080/zero-rule-server"

clover:
  task:
    task-disabled: false
    health-check-interval: 60s
  file-manager:
    upload-root-folder: d:/tmp/zerorule/upload


spring:
  config:
    activate:
      on-profile:
        - local
  devtools:
    livereload:
      enabled: false

# 로컬 영상 제공을 활성화한다. 서버 시작 전에 root 폴더를 생성하고 공개 가능한 영상만 둔다.
popup:
  video:
    enabled: true
    root: D:/popup-videos
